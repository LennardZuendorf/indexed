# Single-package configuration for the indexed project.
# The former uv workspace (apps/ + packages/) was collapsed into one
# `indexed` package under src/indexed/ (simplify/3).

[project]
name = "indexed-sh"
# Version comes from the git tag (hatch-vcs) — never hand-edited, never
# backmerged. A release tag vX.Y.Z IS the version; see .github/workflows.
dynamic = ["version"]
description = "CLI and MCP server for semantic document search with AI agent integration"
readme = "README.md"
license = { text = "See LICENSE file" }
authors = [
    { name = "Lennard Zündorf", email = "lennard@zuendorf.me" }
]
keywords = ["semantic-search", "mcp", "rag", "faiss", "ai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "License :: Other/Proprietary License"
]
requires-python = ">=3.11"
# Floors track the versions the suite runs against, so a fresh resolve can't
# drop to an untested combination. mcp >=1.28.1 is a security floor.
dependencies = [
    # CLI / MCP
    "typer>=0.26.8",
    "rich>=15.0.0",
    # <2: mcp 2.0 renames FastMCP -> MCPServer and swaps httpx for httpx2.
    "mcp>=1.29.0,<2",
    "fastmcp>=3.4.7,<4",
    "art>=6.5",
    # config
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tomlkit>=0.15.1",
    # utils
    "loguru>=0.7.3",
    # core (engine / embeddings / faiss)
    "faiss-cpu>=1.15.0",
    "sentence-transformers>=5.7.0",
    "onnxruntime>=1.28.0",
    "orjson>=3.11.9",
    # connectors
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "bs4>=0.0.2",
    "langchain-text-splitters>=1.1.2",
    "atlassian-python-api>=4.0.7",
    "pathspec>=1.1.1",
    "xxhash>=4.0.0",
    # parsing (docling + tree-sitter)
    "docling>=2.119.0",
    "docling-core[chunking]>=2.91.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
]

[project.urls]
Homepage = "https://indexed.sh"
Repository = "https://github.com/LennardZuendorf/indexed"
"Issue Tracker" = "https://github.com/LennardZuendorf/indexed/issues"

[project.scripts]
indexed = "indexed.cli.app:main"
indexed-mcp = "indexed.mcp.cli:cli_main"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

# Version source: the git tag. On a tagged commit this yields the exact release
# version (v0.0.7 -> 0.0.7). Off-tag, post-release anchors on the LAST tag
# rather than guessing the next one: 0.0.7.post4+g5d98c95 reads as "v0.0.7 plus
# 4 commits, at 5d98c95". The default (guess-next-dev) would invent 0.0.8.devN,
# which is wrong whenever the next release isn't a patch bump.
#
# fallback_version keeps a tree with no .git buildable — GitHub's auto-generated
# source tarball, a vendored copy, a `COPY . .` that omits .git. Without it those
# builds die with a LookupError, which the static version never did. Measured:
#
#   no .git                  -> 0.0.0
#   .git, but no tag reachable -> 0.0.0.postN+g<sha>   (fallback as the base)
#   tags reachable, off-tag  -> 0.0.7.postN+g<sha>
#   HEAD == tag              -> exact tag version
#
# So it never hides a shallow or tagless checkout behind a plausible number: the
# .postN+g<sha> suffix is still there and still fails the release job's assert.
# A bare 0.0.0 means "built without history" and can't reach PyPI either.
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/indexed"]

[tool.hatch.build.targets.sdist]
only-include = ["src/indexed"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-httpserver>=1.1.5",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=16.4",
    "ruff>=0.16.2",
    "ty==0.0.58",
    "types-requests>=2.33.0.20260712",
]

# ── uv ──────────────────────────────────────────────────────────────────────
# Security floors for transitive deps. Not imported directly, so they get no
# [project.dependencies] entry; each version is a pip-audit fixed-in.
[tool.uv]
constraint-dependencies = [
    "pillow>=12.3.0",
    "cryptography>=50.0.0",
    "soupsieve>=2.8.4",
    "click>=8.3.3",
    "setuptools>=83.0.0",
    "torch>=2.13.0",
]

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]

[tool.ruff.lint]
# Pinned explicitly: ruff 0.16 widened its implicit defaults to ~413 rules
# (~1000 findings here). These four are what ruff <=0.15 enabled by default.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Ruff 0.16 formats Python blocks in Markdown by default; keep it off the docs.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# Connector reader files that use lambdas for tqdm callbacks
"src/indexed/connectors/confluence/*_document_reader.py" = ["E731"]
"src/indexed/connectors/jira/*_document_reader.py" = ["E731"]

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "unit: marks unit tests",
    "unit_api: marks unit API tests",
    "api: marks tests exercising a connector API surface",
    "benchmark: marks benchmark tests",
    "connectors: marks connector functionality tests",
    "integration: marks integration tests",
    "indexed: marks main app integration tests",
]
addopts = [
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore:.*numpy.core._multiarray_umath.*:DeprecationWarning",
    "ignore:.*builtin type SwigPyPacked has no __module__ attribute.*:DeprecationWarning",
    "ignore:.*builtin type SwigPyObject has no __module__ attribute.*:DeprecationWarning",
    "ignore:.*builtin type swigvarlink has no __module__ attribute.*:DeprecationWarning",
]

# ── Coverage ────────────────────────────────────────────────────────────────
# Coverage is scoped to the engine/connector/config layers. The CLI and MCP
# presentation layers (indexed.cli, indexed.mcp) are UI chrome and are exempt
# from the coverage gate; measure and enforce ≥85% on the remaining packages
# (core, connectors, config, parsing, protocols, utils).
[tool.coverage.run]
source_pkgs = ["indexed"]
source = ["src/indexed"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/conftest.py",
    "*/setup.py",
    "*/indexed/cli/*",
    "*/indexed/mcp/*",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ── ty (Astral type checker) ────────────────────────────────────────────────
# ty replaces mypy as the sole type checker. ty is beta (0.0.x, no stable
# API), so the version is pinned exactly in [dependency-groups].dev and in the
# .pre-commit ty hook rev; it has no baseline/diff mode, so the tree must stay
# fully clean (0 diagnostics), not baseline-carried like mypy's 0-new policy.
[tool.ty.environment]
python-version = "3.11"
root = ["./src"]

[tool.ty.src]
# Scope checks to the package. Kept identical to the manual gate
# (`ty check src/indexed`) and the config-driven pre-commit hook so all three
# check the same file set.
include = ["src/indexed"]
