# Grouped so a refresh lands as a couple of PRs, not one per package.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      ml-and-parsing:
        patterns:
          - "torch*"
          - "sentence-transformers"
          - "transformers"
          - "onnxruntime*"
          - "faiss-cpu"
          - "docling*"
          - "tree-sitter*"
      dev-tooling:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
