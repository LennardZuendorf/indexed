# Dependabot was not configured before this file, so the dependency tree drifted
# until advisories accumulated (22 across 7 packages at the time this landed).
# Grouping keeps the noise to a couple of PRs a week rather than one per package;
# security updates are deliberately left ungrouped so they arrive on their own.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      # Matches the repo's convention: <type>(<scope>): <subject>, <=50 chars.
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      # The ML/parsing stack moves together and is slow to verify — one PR.
      ml-and-parsing:
        patterns:
          - "torch*"
          - "sentence-transformers"
          - "transformers"
          - "onnxruntime*"
          - "faiss-cpu"
          - "docling*"
          - "tree-sitter*"
      dev-tooling:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
