name: Benchmark Baseline Guard

# Benchmark jobs may measure, but only a baseline-only PR may move main's
# baseline. Two rules are enforced here:
#
# 1. A PR that changes code may not touch .benchmarks/baselines/main.json. It
#    would then be gated against numbers it wrote itself, so a regression lands
#    as the new reference instead of failing. (.github/workflows/python-benchmark.yml
#    runs PR jobs with `contents: read` so the benchmark action cannot create
#    such a commit at all — this job is the backstop if that ever regresses.)
# 2. A PR that changes nothing but the baseline is allowed: that is the
#    sanctioned refresh lane (dispatch `python-benchmark.yml` on main and it
#    opens one), where no gate decision depends on the numbers being written.
#
# A `pull_request`-only guard would miss a bot commit pushed with `[skip ci]`,
# because that suppresses `synchronize` — hence the `pull_request_review` and
# `workflow_dispatch` triggers below. See .spec/tech.md § CI Benchmarking.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

# Read-only: this job compares blob ids and writes nothing.
permissions:
  contents: read

concurrency:
  group: baseline-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-guard:
    name: baseline-guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout PR head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The head SHA, not the merge ref: the drift commit is what must be
        # inspected, and on a fork PR the head lives in another repository.
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        # Finding the merge base with the base repo's main needs full history.
        fetch-depth: 0
        persist-credentials: false

    # Blob-id comparison: no JSON parse, no benchmark install, no model download.
    # Against the MERGE BASE, not main's tip: a branch merely behind main must
    # not fail for inheriting an older (main-authored) baseline.
    - name: This PR must not move main's baseline
      run: |
        file=.benchmarks/baselines/main.json
        # `origin` is whichever repository checkout was pointed at — for a fork
        # PR that is the FORK, so fetch main from the base repo explicitly.
        base_repo="https://github.com/${GITHUB_REPOSITORY}.git"
        git fetch --no-tags "$base_repo" main
        main=$(git rev-parse FETCH_HEAD)
        base=$(git merge-base HEAD "$main") || {
          echo "::error file=$file::No common ancestor between this PR and $base_repo main; baseline drift cannot be checked."
          exit 1
        }
        head_blob=$(git rev-parse "HEAD:$file" 2>/dev/null || echo absent)
        base_blob=$(git rev-parse "$base:$file" 2>/dev/null || echo absent)
        if [ "$head_blob" = "$base_blob" ]; then
          echo "$file unchanged by this PR ($head_blob)"
          exit 0
        fi
        # Everything else this PR touches. Empty = a baseline-only PR, the one
        # shape allowed to move the file: no code change, so nothing here is
        # gated against the numbers it writes, and it shows up as its own
        # reviewable diff instead of riding along with a fix.
        others=$(git diff --name-only "$base" HEAD -- . ":(exclude)$file")
        if [ -z "$others" ]; then
          echo "::notice::$file moved by a baseline-only PR — the sanctioned refresh lane."
          exit 0
        fi
        msg="$file was rewritten by this PR (head $head_blob, base $base_blob, main $(git rev-parse "$main:$file")). A PR that changes code may not move main's baseline: the benchmark gate would then compare against numbers the PR itself wrote, so a regression is recorded as the new reference instead of failing. Fix: git fetch --no-tags $base_repo main && git checkout FETCH_HEAD -- $file, commit, then re-run the benchmark job — the benchmark job has no write scope, so it will not re-add the file on that re-run. To move the baseline on purpose, dispatch the benchmark workflow on main instead."
        echo "::error file=$file,line=1::$msg"
        echo "$msg"
        exit 1
