name: Python Performance Benchmarks

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-benchmark.yml'
      - 'tests/system/**'
      - 'tests/benchmarks/**'

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event.pull_request.draft != true
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push baseline commit onto PR branch
      pull-requests: write  # Required to comment on PRs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]  # Use single version for consistent benchmarks

    steps:
    - name: Cache HuggingFace embedding model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
        key: hf-model-all-MiniLM-L6-v2

    - name: Run benchmarks
      uses: lennardzuendorf/pytest-bench-action@v1.0.2
      with:
        python-version: ${{ matrix.python-version }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        setup-command: python -m pip install uv && python -m uv sync
        pre-benchmark-command: |
          uv run python -c "
          from indexed.core.v1.engine.indexes.embeddings.model_manager import ensure_model
          ensure_model('all-MiniLM-L6-v2')
          print('Model ready')
          "
        benchmark-run-command: >
          uv run pytest tests/system tests/benchmarks
          --benchmark-only
          --benchmark-json=benchmark-results.json
          -v
        cross-branch-tolerance: 20
        update-tolerance: 5
        threshold-map: '{"help": 0.5, "inspect": 0.5, "e2e_create": 30.0, "e2e_search": 5.0, "parse_png": 10.0, "parse_large": 5.0, "full_connector_pipeline_mixed": 20.0, "full_connector_pipeline": 10.0, "batch_parse": 5.0, "parse_markdown_docs": 3.0}'
        override-label: benchmark-override
