name: Python Performance Benchmarks

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-benchmark.yml'
      - 'tests/system/**'
      - 'tests/benchmarks/**'
  # Dispatch-only refresh lane: run this workflow on `main` and the second job
  # re-measures the numbers and opens a baseline-only PR. A PR run never writes.
  # See .spec/tech.md § CI Benchmarking and issue #253.
  workflow_dispatch:
    inputs:
      accept_cpu_change:
        # GitHub rotates the ubuntu-latest fleet without asking. When the CPU
        # fingerprint changes, the refresh otherwise refuses to adopt the new
        # numbers (see "Summarise drift") and nothing in the repo can re-record
        # the baseline — every PR then compares against a machine that no
        # longer exists. This input is the sanctioned repair, and its PR records
        # both fingerprints so the move is visible in review (#267).
        description: >-
          Adopt this runner's numbers even though its CPU fingerprint differs
          from the committed baseline. Set only after a runner-fleet rotation.
        type: boolean
        default: false

# Read-only default; each job below opts into exactly the writes it needs.
permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # Measure and gate, never write. `contents: read` is the hard guarantee that
    # this job cannot move .benchmarks/baselines/main.json: the action's update
    # path stages that file and pushes a `[skip ci]` commit, so with no write
    # scope the push cannot succeed. Do NOT grant `contents: write` here again —
    # it leaves the PR head as an untested SHA and hands the gate its own
    # numbers, which is the defect in #253. The baseline moves only through
    # `refresh-baseline` below, as a reviewed PR.
    permissions:
      contents: read
      pull-requests: write  # required to post the report comment
    steps:
    - name: Cache HuggingFace embedding model
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
        key: hf-model-all-MiniLM-L6-v2

    # This action does its own checkout at a hardcoded fetch-depth: 2 with no
    # tags and no input to override it, so `uv sync` below installs the package
    # as 0.0.0.postN+g<sha> rather than a tag-derived version. Harmless here —
    # nothing under tests/system or tests/benchmarks asserts a version — but it
    # is why the "every workflow uses fetch-depth: 0" rule has an exception.
    #
    # This step is the REPORT, not the gate. It measures the whole suite once and
    # compares it against main's committed baseline — a cross-run, cross-machine
    # comparison, which on the hosted fleet alternates CPU models within a day
    # (#267) and therefore reds by runner lottery. That is why
    # `cross-branch-tolerance` below is inert: the verdict comes from the
    # same-job A/B step after this one. Every value here must otherwise stay
    # identical to the refresh job's copy — GitHub Actions has no YAML merge
    # keys, so the block is duplicated rather than anchored (#271).
    - name: Run benchmarks
      id: benchmark
      uses: lennardzuendorf/pytest-bench-action@415e71e2b6cbd14309df691521a84e44093b8c46 # v1.0.2
      with:
        # One interpreter, pinned: numbers from different interpreters are not
        # comparable, and the baseline is written by whichever run refreshes it.
        python-version: "3.14"
        github-token: ${{ secrets.GITHUB_TOKEN }}
        setup-command: python -m pip install uv && python -m uv sync
        pre-benchmark-command: |
          uv run python -c "
          from indexed.core.v1.engine.indexes.embeddings.model_manager import ensure_model
          ensure_model('all-MiniLM-L6-v2')
          print('Model ready')
          "
        benchmark-run-command: >
          uv run pytest tests/system tests/benchmarks
          --benchmark-only
          --benchmark-json=benchmark-results.json
          -v
        # Inert by design, like `update-tolerance` below: this number is compared
        # across runs and machines, so it reports drift and never decides a PR.
        # The A/B step after this one owns the verdict.
        cross-branch-tolerance: 1000
        # Inert by design: far beyond any real drift, so a PR run never stages a
        # baseline commit in the first place. It cannot be the guarantee on its
        # own — the action also flags an update when the comparison is skipped
        # for a hardware mismatch (exit 3) or when main has no baseline yet, and
        # no tolerance value covers those. `contents: read` above does.
        update-tolerance: 1000
        threshold-map: '{"help": 0.5, "inspect": 0.5, "e2e_create": 30.0, "e2e_search": 5.0, "e2e_v2_create": 30.0, "e2e_v2_search": 5.0, "parse_png": 10.0, "parse_large": 5.0, "full_connector_pipeline_mixed": 20.0, "full_connector_pipeline": 10.0, "batch_parse": 5.0, "parse_markdown_docs": 3.0}'
        override-label: benchmark-override

    # The gate: two measurements taken in THIS job on THIS runner, back to back.
    # A benchmark number carries the machine that produced it, and the hosted
    # fleet alternates CPU models within a day (#267), so a committed cross-run
    # baseline can only ever be a drift report. Hardware, tenancy and CPU
    # frequency cancel out of a same-job ratio; nothing else does. The rows that
    # used to rotate red are the ones measured here — the rest of the suite is
    # reported by the step above and decides nothing.
    - name: Same-job A/B gate (merge base vs head)
      # Runs only if the report step succeeded: that step owns the checkout, the
      # interpreter and this job's venv, so a failed install leaves nothing to
      # A/B. Its own comparison cannot fail this way — its tolerances are inert.
      if: steps.benchmark.outcome == 'success'
      env:
        # The branch this PR merges into: measured as a tree, never as a
        # baseline file (see .spec/tech.md § CI Benchmarking).
        BASE_REF: ${{ github.base_ref }}
        AB_TOLERANCE: "20"
        BASE_DIR: ${{ runner.temp }}/bench-ab-base
        BASE_RESULTS: ${{ runner.temp }}/bench-ab-base.json
        HEAD_RESULTS: ${{ runner.temp }}/bench-ab-head.json
      run: |
        set -euo pipefail
        # The rows the gate owns: the three that rotated red on hardware rather
        # than on a diff (#267). Everything else is measured and reported by the
        # step above; a full-suite A/B would double an 8-minute job, this subset
        # measured 40 s end to end (run 41407096799).
        AB_TESTS=(
          "tests/benchmarks/test_parsing_performance.py::test_parse_markdown_docs"
          "tests/benchmarks/test_parsing_performance.py::test_parse_large_markdown"
          "tests/system/test_search_performance.py::test_searcher_first_search"
        )

        # `origin/<base_ref>` is the base this PR would land on: what the diff
        # adds, measured on top of main as it is now. Read, not merged — this
        # checkout is shallow (fetch-depth: 2, inside the action), so
        # `git merge-base` would need the whole history for no gain in what is
        # being measured.
        git fetch --no-tags --depth=1 origin \
          "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        BASE_SHA=$(git rev-parse --short "origin/${BASE_REF}")

        # The base, in its own worktree and its own venv: `uv sync` there
        # resolves the base's lock, so a PR that changes dependencies is
        # measured with the base's dependencies too. Nothing here mutates this
        # job's venv, which the head run below uses unchanged.
        git worktree add --detach "${BASE_DIR}" "origin/${BASE_REF}"
        if ! (
          cd "${BASE_DIR}"
          python -m uv sync
          python -m uv run --no-sync pytest "${AB_TESTS[@]}" \
            --benchmark-only --benchmark-json "${BASE_RESULTS}"
        ); then
          echo "::error title=Same-job measurement invalid::the merge-base run did not complete, so this job measured only one side. That is a harness bug, not a verdict."
          exit 1
        fi

        # Then the head, immediately, on the same runner: back-to-back is the
        # whole point. Re-running the base, or moving to another job, would put
        # the two sides minutes and one tenancy change apart again.
        python -m uv run --no-sync pytest "${AB_TESTS[@]}" \
          --benchmark-only --benchmark-json "${HEAD_RESULTS}"

        # The verdict, from those two files only. The comparator prints both CPU
        # fingerprints and refuses to turn a machine mismatch into a pass.
        python "${GITHUB_WORKSPACE}/scripts/benchmark_ab.py" \
          --base "${BASE_RESULTS}" \
          --head "${HEAD_RESULTS}" \
          --tolerance "${AB_TOLERANCE}" \
          --base-label "origin/${BASE_REF} @ ${BASE_SHA}" \
          --head-label "${GITHUB_SHA}" \
          --summary "${GITHUB_STEP_SUMMARY}"

  refresh-baseline:
    # Dispatch-only and main-only. A baseline move is never a side effect of
    # somebody else's PR: this run measures main, then opens a PR that changes
    # nothing but the baseline file, so the move is reviewed like any other
    # change (and the guard allows a baseline-only PR — see
    # .github/workflows/baseline-guard.yml).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Refresh main baseline
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the refresh branch
      pull-requests: write  # open the refresh PR
    steps:
    - name: Cache HuggingFace embedding model
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
        key: hf-model-all-MiniLM-L6-v2

    # Same pin and same measurement inputs as the PR job, with one deliberate
    # difference: `cross-branch-tolerance` is live (20) here. This run compares
    # main against main's own committed baseline on a dispatch that only main
    # triggers, which is the coarse drift alarm — it is not a PR verdict, and
    # there is no same-job A/B to take its place. GitHub Actions has no YAML
    # merge keys, so this block is a copy of the PR job's: change both together.
    # The action's update path is pull_request-only, so this run never pushes
    # anything; its "Save baseline" step rewrites .benchmarks/baselines/main.json
    # in the workspace and that rewritten file is the refresh. A >20% slowdown
    # against main's previous numbers fails the run here instead — that is a
    # regression to investigate, not a baseline to adopt.
    - name: Measure main
      uses: lennardzuendorf/pytest-bench-action@415e71e2b6cbd14309df691521a84e44093b8c46 # v1.0.2
      with:
        python-version: "3.14"
        github-token: ${{ secrets.GITHUB_TOKEN }}
        setup-command: python -m pip install uv && python -m uv sync
        pre-benchmark-command: |
          uv run python -c "
          from indexed.core.v1.engine.indexes.embeddings.model_manager import ensure_model
          ensure_model('all-MiniLM-L6-v2')
          print('Model ready')
          "
        benchmark-run-command: >
          uv run pytest tests/system tests/benchmarks
          --benchmark-only
          --benchmark-json=benchmark-results.json
          -v
        cross-branch-tolerance: 20
        update-tolerance: 1000
        threshold-map: '{"help": 0.5, "inspect": 0.5, "e2e_create": 30.0, "e2e_search": 5.0, "e2e_v2_create": 30.0, "e2e_v2_search": 5.0, "parse_png": 10.0, "parse_large": 5.0, "full_connector_pipeline_mixed": 20.0, "full_connector_pipeline": 10.0, "batch_parse": 5.0, "parse_markdown_docs": 3.0}'
        override-label: benchmark-override

    - name: Summarise drift against main's baseline
      id: drift
      env:
        FILE: .benchmarks/baselines/main.json
        DRIFT_PCT: "5"
        # Empty on a PR run; only a dispatch can set it. Boolean inputs arrive
        # as the string "true"/"false" and "" when the event has no inputs.
        ACCEPT_CPU_CHANGE: ${{ inputs.accept_cpu_change }}
      run: |
        set -euo pipefail
        # The committed file is main's reference; the workspace copy is what
        # this run just measured. HEAD is trustworthy here where it is not in the
        # gate job: the action's update path is PR-only, so nothing in this run
        # commits a baseline of its own.
        git show "HEAD:$FILE" > "${RUNNER_TEMP}/committed-baseline.json"
        python - <<'PY'
        import json, os, pathlib

        old = json.load(open(f"{os.environ['RUNNER_TEMP']}/committed-baseline.json"))
        new = json.load(open(os.environ["FILE"]))
        out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
        limit = float(os.environ["DRIFT_PCT"])
        accept = os.environ.get("ACCEPT_CPU_CHANGE") == "true"

        def fingerprint(doc):
            mi, cpu = doc.get("machine_info", {}), doc.get("machine_info", {}).get("cpu", {})
            return f"{cpu.get('brand_raw')}|{cpu.get('arch')}|{cpu.get('count')}|{mi.get('system')}"

        was_fp, now_fp = fingerprint(old), fingerprint(new)
        cpu_changed = was_fp != now_fp
        if cpu_changed and not accept:
            # Adopting another machine's numbers would poison the reference the
            # gate compares against, so a hardware change is refused unless it
            # is an explicit, reviewed act (dispatch accept_cpu_change: true).
            print(f"::notice::Hardware changed ({was_fp} -> {now_fp}); not refreshing the baseline. Re-dispatch with accept_cpu_change: true after a runner-fleet rotation.")
            out.write_text("moved=false\ncpu_changed=false\n")
            raise SystemExit(0)

        def means(doc):
            return {
                b.get("fullname") or b.get("name"): b["stats"]["mean"]
                for b in doc.get("benchmarks", [])
            }

        was, now = means(old), means(new)
        rows = []
        for name in sorted(set(was) & set(now)):
            pct = (now[name] - was[name]) / was[name] * 100 if was[name] else 0.0
            rows.append((pct, name, was[name], now[name]))

        moved = [r for r in rows if abs(r[0]) > limit]
        dropped = sorted(set(was) ^ set(now))
        for name in dropped:
            print(f"::warning::Benchmark {name} is only in one of the two files; not compared.")

        table = [
            "| Benchmark | Baselines | This run | Change |",
            "|---|---|---|---|",
        ] + [
            f"| `{name}` | {before * 1000:.2f} ms | {after * 1000:.2f} ms | {pct:+.1f}% |"
            for pct, name, before, after in sorted(rows, key=lambda r: -abs(r[0]))
            if abs(pct) > limit
        ]
        pathlib.Path("drift-table.md").write_text("\n".join(table) + "\n")
        for pct, name, before, after in sorted(rows, key=lambda r: -abs(r[0]))[:5]:
            print(f"{pct:+7.1f}%  {name}  ({before * 1000:.2f} -> {after * 1000:.2f} ms)")
        print(f"{len(moved)} of {len(rows)} benchmarks moved more than {limit:g}%.")
        if cpu_changed:
            # Named in the job summary AND the refresh PR body: the move is a
            # measurement to review, never a verdict on this diff.
            note = [
                "### Hardware change accepted",
                "",
                f"Committed baseline: `{was_fp}`",
                "",
                f"This run: `{now_fp}`",
                "",
                "The numbers below are a cross-CPU **measurement, not a drift verdict** —",
                "they cannot say whether code got slower. They exist so the next PR run",
                "compares like with like again. Accepting them was this dispatch's",
                "`accept_cpu_change: true`; without it this refresh refuses to move.",
                "",
            ]
            text = "\n".join(note) + "\n"
            pathlib.Path("cpu-change.md").write_text(text)
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                summary.write("## Baseline refresh: hardware change accepted\n\n" + text)
            print(f"::warning::Hardware change accepted ({was_fp} -> {now_fp}); adopting these numbers as main's baseline.")
        out.write_text(
            f"moved={'true' if moved or cpu_changed else 'false'}\n"
            f"cpu_changed={'true' if cpu_changed else 'false'}\n"
        )
        PY

    - name: Open a baseline-refresh PR when the numbers moved
      if: steps.drift.outputs.moved == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FILE: .benchmarks/baselines/main.json
        BRANCH: chore/benchmark-baseline-refresh
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Detached HEAD or branch: -B works for both.
        git checkout -B "$BRANCH"
        git add "$FILE"
        if [ "${{ steps.drift.outputs.cpu_changed }}" = "true" ]; then
          git commit -m "chore(benchmark): refresh main baseline (new CPU)"
        else
          git commit -m "chore(benchmark): refresh main baseline"
        fi
        git push --force origin "$BRANCH"
        # A CPU move must be visible in the PR list, not only in the body: it is
        # the one baseline change nobody should skim past.
        if [ "${{ steps.drift.outputs.cpu_changed }}" = "true" ]; then
          TITLE='chore(benchmark): refresh main baseline (new CPU)'
        else
          TITLE='chore(benchmark): refresh main baseline'
        fi
        {
          echo "Re-measures \`main\` and stores the numbers this run produced."
          echo
          echo "Changes only \`$FILE\` — the one shape of baseline move a PR may"
          echo "make (see \`.spec/tech.md\` § CI Benchmarking). No code change, so no"
          echo "gate decision here is made against numbers this PR writes."
          echo
          if [ -f cpu-change.md ]; then cat cpu-change.md; fi
          cat drift-table.md
          echo
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        } > "${RUNNER_TEMP}/refresh-body.md"
        if gh pr list --head "$BRANCH" --json number --jq 'length' | grep -qv '^0$'; then
          gh pr edit "$BRANCH" --body-file "${RUNNER_TEMP}/refresh-body.md"
          echo "Refresh PR already open — branch force-pushed and body refreshed."
          exit 0
        fi
        gh pr create --base main --head "$BRANCH" \
          --title "$TITLE" \
          --body-file "${RUNNER_TEMP}/refresh-body.md"
