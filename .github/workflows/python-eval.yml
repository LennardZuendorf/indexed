name: Retrieval Evaluation

# Gates retrieval quality on the product's actual promise: the right passage in
# the top k. The verdict comes from two measurements taken back to back in THIS
# job on THIS runner — the merge base (`origin/<base ref>`) and the PR head —
# because a retrieval number carries the machine that produced it. The old job
# compared one fresh run against the committed `eval/baseline.json` and had to
# stay informative: the runner is a different interpreter/CPU build from the
# baseline's arm64 machine, and that alone moved hit@5 from 0.818 to 0.909.
# Same-job measurement cancels the machine out (see .spec/tech.md § Retrieval
# evaluation gate and scripts/benchmark_ab.py).

on:
  workflow_dispatch:
    inputs:
      variance_repeats:
        # Tolerance provenance, not a gate input: measure the head tree N times
        # in one job and print the run-to-run spread. The constant in
        # scripts/benchmark_ab.py carries the observed number.
        description: >-
          Measure the head tree this many times and report the metric spread
          (1 = gate only).
        type: number
        default: 1
  pull_request:
    paths:
      - 'src/indexed/core/**'
      - 'src/indexed/eval/**'
      - 'src/indexed/connectors/**'
      - 'src/indexed/parsing/**'
      - 'eval/**'
      - 'scripts/build_eval_corpus.py'
      - 'scripts/benchmark_ab.py'
      - 'tests/unit/indexed/eval/**'
      - 'tests/unit/test_benchmark_ab.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/scripts/**'
      - '.github/workflows/python-eval.yml'

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  retrieval-baseline:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true
    name: Retrieval Baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # The branch this PR merges into. A dispatch has no PR, so it gates main.
      BASE_REF: ${{ github.base_ref || 'main' }}
      BASE_REPORT: eval-ab-base.json
      HEAD_REPORT: eval-ab-head.json
      AB_RESULT: eval-ab.json
      # Absolute metric points; the derivation lives next to the constant in
      # scripts/benchmark_ab.py (measured base/head boundary + margin).
      AB_TOLERANCE: "0.04"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Cache HuggingFace embedding model
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
        key: hf-model-all-MiniLM-L6-v2

    - name: Install dependencies
      run: |
        python -m pip install uv
        python -m uv sync --all-groups

    - name: Unit tests for the PR report
      run: uv run node --test .github/scripts/eval-comment.test.cjs

    - name: Verify the pinned corpus has not drifted
      id: corpus
      run: uv run python scripts/build_eval_corpus.py --check

    - name: Unit tests for the harness and the comparator
      id: harness
      run: |
        uv run pytest tests/unit/indexed/eval -q
        uv run pytest tests/unit/test_benchmark_ab.py -q

    # Both sides, one runner, back to back. The base is measured in its own
    # worktree and its own venv, so a PR that changes dependencies is compared
    # against the base's dependencies too; nothing here mutates this job's venv,
    # which the head run below uses unchanged. The repeats are the tolerance
    # probe (workflow_dispatch only) — the gate itself measures each side once.
    - name: Measure merge base and head in this job
      id: measure
      if: ${{ !cancelled() && steps.corpus.outcome == 'success' }}
      env:
        BASE_DIR: ${{ runner.temp }}/eval-ab-base
        REPEATS: ${{ inputs.variance_repeats || '1' }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        BASE_SHA=$(git rev-parse --short "origin/${BASE_REF}")
        echo "base revision: origin/${BASE_REF} @ ${BASE_SHA}"
        echo "head revision: ${GITHUB_SHA}"
        echo "BASE_LABEL=origin/${BASE_REF} @ ${BASE_SHA}" >> "${GITHUB_ENV}"

        git worktree add --detach "${BASE_DIR}" "origin/${BASE_REF}"
        (
          cd "${BASE_DIR}"
          python -m uv sync
          GIT_COMMIT=$(git rev-parse HEAD) \
            python -m uv run --no-sync indexed-eval run --out "${GITHUB_WORKSPACE}/${BASE_REPORT}"
        ) || {
          echo "::error title=Same-job measurement invalid::the merge-base run did not complete, so this job measured only one side. That is a harness bug, not a verdict."
          exit 1
        }

        GIT_COMMIT="${GITHUB_SHA}" \
          python -m uv run --no-sync indexed-eval run --out "${HEAD_REPORT}"
        echo "${HEAD_REPORT}" > "${RUNNER_TEMP}/head-reports.txt"

        if [ "${REPEATS}" -gt 1 ]; then
          for index in $(seq 2 "${REPEATS}"); do
            GIT_COMMIT="${GITHUB_SHA}" \
              python -m uv run --no-sync indexed-eval run --out "eval-ab-head-${index}.json"
            echo "eval-ab-head-${index}.json" >> "${RUNNER_TEMP}/head-reports.txt"
          done
        fi

    # The verdict: two files from this job, nothing else. The comparator prints
    # both revisions and both fingerprints, and refuses to turn a machine
    # mismatch into a pass (exit 2, "this is a harness bug, not a verdict").
    - name: Retrieval gate (merge base vs head)
      id: gate
      if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
      run: |
        HOST_FP=$(uv run --no-sync python scripts/benchmark_ab.py --show-host-fingerprint)
        echo "job CPU fingerprint: ${HOST_FP}"
        uv run --no-sync python scripts/benchmark_ab.py \
          --base "${BASE_REPORT}" \
          --head "${HEAD_REPORT}" \
          --tolerance "${AB_TOLERANCE}" \
          --host-fingerprint "${HOST_FP}" \
          --base-label "${BASE_LABEL}" \
          --head-label "head @ ${GITHUB_SHA}" \
          --out "${AB_RESULT}" \
          --summary "${GITHUB_STEP_SUMMARY}"

    - name: Run-to-run spread of the same tree
      if: ${{ !cancelled() && steps.measure.outcome == 'success' && inputs.variance_repeats > 1 }}
      run: uv run --no-sync python scripts/benchmark_ab.py --spread $(cat "${RUNNER_TEMP}/head-reports.txt")

    - name: Upload eval artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: retrieval-eval
        path: |
          eval-ab-base.json
          eval-ab-head*.json
          eval-ab.json
        if-no-files-found: warn

    - name: Publish eval summary and PR comment
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        HARNESS_OUTCOME: ${{ steps.harness.outcome }}
        MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        GATE_OUTCOME: ${{ steps.gate.outcome }}
      with:
        script: |
          await require('./.github/scripts/eval-comment.cjs').publishReport({
            github, context, core,
            outcomes: {
              harness: process.env.HARNESS_OUTCOME,
              measure: process.env.MEASURE_OUTCOME,
              gate: process.env.GATE_OUTCOME,
            },
          });
