name: Python Build and System Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-ci.yml'
      - 'tests/system/**'
  push:
    branches: [ "main", "building" ]

# Least privilege by default: every job here only reads the repo. Any job that
# needs more must opt in explicitly at the job level.
permissions:
  contents: read

# Supersede in-flight runs for the same ref — a force-push or a quick follow-up
# commit shouldn't leave the previous matrix burning runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-system-tests:
    if: github.event_name == 'push' || github.event.pull_request.draft != true
    name: Build and System Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # The version is derived from git tags (hatch-vcs), so the wheel built
        # below needs them. On a depth-1 tagless checkout hatch-vcs silently
        # falls back to 0.1.devN+g<sha> and every gate here still passes — a
        # wrong version that goes green. Full history prevents that.
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install uv
        python -m uv sync

    - name: Check import graph
      run: uv run python scripts/check_imports.py

    - name: Check size gates
      run: uv run python scripts/check_sizes.py

    - name: Run System Tests
      run: |
        uv run pytest tests/system/ -q --tb=short

    - name: Build Distributable Wheel
      run: uv build --wheel --out-dir dist

    - name: Validate wheel with PyPI's archive validator
      run: uv run python scripts/validate_wheel.py dist/*.whl

    - name: Check distribution metadata (twine)
      # validate_wheel.py (above) checks the archive/zip bytes; twine check
      # validates the METADATA long_description renders on PyPI. --strict makes
      # render warnings fail. (Classifier/version validity is enforced by PyPI
      # warehouse at upload, not here — this is an early-fail convenience.)
      run: uv run --with twine twine check --strict dist/*
