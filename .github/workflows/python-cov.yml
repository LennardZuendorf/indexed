name: Python Full Test Suite with Coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-cov.yml'
      - 'tests/**'
  push:
    branches: [ "main", "building" ]

# Least privilege by default: this workflow only reads the repo. Codecov upload
# authenticates with CODECOV_TOKEN, not the GITHUB_TOKEN, so no write is needed.
permissions:
  contents: read

# Supersede in-flight runs for the same ref — the full suite is the long pole,
# so a superseded run is the most expensive thing to leave running. Keyed by
# event so a manual dispatch doesn't cancel the push run for the same ref.
# Cancellation is PR-only: cancelling on main would drop that commit's coverage
# upload to Codecov.
concurrency:
  group: cov-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-test-suite:
    if: github.event_name == 'push' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    name: Full Test Suite with Coverage
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs reads the version from git tags at install time; without
          # them `uv sync` installs the project as 0.0.0.postN+g<sha> and warns
          # that the checkout is shallow.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Ruff and pytest come from the project's dev dependencies, not from
      # standalone tool installs, so the versions match what runs locally.
      - name: Install dependencies
        run: |
          python -m pip install uv
          python -m uv sync

      - name: Security audit (OSV)
        run: uv tool run pip-audit --vulnerability-service osv

      - name: Run Ruff Linter
        run: |
          uv run ruff check

      - name: Run ty Type Checker
        run: |
          uv run ty check src/indexed

      - name: Run Unit Tests with Coverage
        # Coverage is scoped to engine/connector/config code; indexed.cli and
        # indexed.mcp (UI chrome) are omitted via [tool.coverage.run] in
        # pyproject.toml, which also enforces fail_under = 85.
        run: |
          uv run pytest tests/unit/ --cov=indexed --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=85 -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
