name: Release — Build + Publish to PyPI

# Trigger: publish a GitHub Release (UI) with a semver tag (vX.Y.Z or X.Y.Z).
# The tag IS the release version — chosen at release time, not pre-bumped.
#
# Flow:
#   build      — checkout the tag, set pyproject version FROM the tag, build
#                wheel + sdist, validate (archive + twine metadata)
#   publish    — OIDC trusted-publish to PyPI, attach dists to the Release
#   backmerge  — after a successful publish, write the version bump
#                (pyproject.toml + uv.lock) back to main so source stays
#                truthful between releases  [skip ci]
#
# Versioning: no manual pre-bump, no sync_version.py. `uv version` sets it
# natively from the tag; the backmerge job keeps main in sync.
on:
  release:
    types: [published]
  workflow_dispatch:   # build-only smoke test (no publish, no backmerge)

concurrency:
  group: release
  cancel-in-progress: false

# Default for any job that does not set its own; release jobs widen it below.
permissions:
  contents: read

jobs:
  # ── 1. Build wheel + sdist from the tag and validate ────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout tagged commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"

    - name: Install uv
      run: python -m pip install uv

    - name: Install dependencies
      run: uv sync

    - name: Set version from release tag
      # The tag is the release version. Validate semver, then write it into the
      # ephemeral checkout's pyproject so the built wheel carries it. --frozen:
      # don't re-lock here (the build doesn't need uv.lock; the backmerge job
      # updates the lock on main). Skipped on workflow_dispatch (no tag).
      if: github.event_name == 'release'
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        ver="${REF_NAME#v}"
        if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::release tag '$REF_NAME' is not a X.Y.Z semver version"
          exit 1
        fi
        uv version --frozen "$ver"
        echo "set version to $ver"

    - name: Build wheel + sdist
      run: uv build --out-dir dist

    - name: Validate wheel with PyPI's archive validator
      # Same checks PyPI's warehouse runs on upload. Wheel-only: this is a ZIP
      # validator and cannot read the .tar.gz sdist (twine check covers both).
      run: uv run python scripts/validate_wheel.py dist/*.whl

    - name: Check distribution metadata (twine)
      # Archive validator (above) checks the zip bytes; twine check --strict
      # validates that the long_description renders on PyPI (render warnings
      # fail). Full metadata acceptance is enforced by the OIDC publish itself.
      run: uv run --with twine twine check --strict dist/*

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: python-package-distributions
        path: dist/
        if-no-files-found: error
        # Distributions are already compressed; don't recompress.
        compression-level: 0

  # ── 2. Publish to PyPI via OIDC trusted publisher ───────────────────────────
  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indexed-sh
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: write   # attach distributions to the Release
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      # Default packages-dir: dist/ — no override needed.

    - name: Attach distributions to GitHub Release
      if: always()
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: dist/*

  # ── 3. Backmerge the version bump into main ─────────────────────────────────
  backmerge-version:
    name: Backmerge version to main
    needs: publish-to-pypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the bump commit to main
    steps:
    - name: Checkout main
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: main
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"

    - name: Install uv
      run: python -m pip install uv

    - name: Bump pyproject + uv.lock to the released version
      # --no-sync: re-lock uv.lock (so it records the new version) but skip the
      # virtualenv sync — nothing runs afterwards in this job.
      env:
        REF_NAME: ${{ github.ref_name }}
      run: uv version --no-sync "${REF_NAME#v}"

    - name: Commit and push bump to main
      uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
      with:
        add: 'pyproject.toml uv.lock'
        default_author: github_actions
        message: 'chore: release ${{ github.ref_name }} [skip ci]'
        pull: '--rebase --autostash'
        push: true
