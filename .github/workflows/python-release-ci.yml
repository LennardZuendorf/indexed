name: Release — Build + Publish to PyPI

# Trigger: publish a GitHub Release in the GitHub UI (manual).
# Flow: build wheel + sdist from the TAGGED commit → validate → publish to
# PyPI → attach to the release.
#
# Versioning: pyproject.toml is the single source of truth (bump it in the
# release PR before tagging). The release tag must equal that version — the
# build job fails loud on mismatch. There is no version-rewrite step.
#
# Distributions are NEVER committed to git. They are built fresh in CI on every
# release, validated (scripts/validate_wheel.py archive check + twine metadata),
# uploaded to PyPI via OIDC trusted publishing, and attached to the GitHub
# Release as the durable archive.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ── 1. Build wheel + sdist from the tagged commit and validate ──────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout tagged commit
      # On `release: published`, checkout defaults to the tag ref — build the
      # TAGGED commit, not main's tip (version lives in pyproject.toml now).
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      run: python -m pip install uv

    - name: Install dependencies
      run: uv sync

    - name: Verify release tag matches pyproject version
      # pyproject.toml is the single source of truth. Guard against tagging a
      # release without bumping the version. Skipped on workflow_dispatch
      # (ref is a branch, not a semver tag).
      if: github.event_name == 'release'
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        tag="${REF_NAME#v}"
        ver="$(uv version --short)"
        if [ "$tag" != "$ver" ]; then
          echo "::error::release tag '$REF_NAME' (=$tag) != pyproject version '$ver' — bump pyproject.toml before tagging"
          exit 1
        fi
        echo "tag $REF_NAME matches pyproject version $ver"

    - name: Build wheel + sdist
      run: uv build --out-dir dist

    - name: Validate wheel with PyPI's archive validator
      # Same checks PyPI's warehouse runs on upload. Wheel-only: this is a ZIP
      # validator and cannot read the .tar.gz sdist (twine check covers both).
      run: uv run python scripts/validate_wheel.py dist/*.whl

    - name: Check distribution metadata (twine)
      # Archive validator (above) checks the zip bytes; twine check --strict
      # validates that the long_description renders on PyPI (render warnings
      # fail). Full metadata acceptance is enforced by the OIDC publish itself.
      run: uv run --with twine twine check --strict dist/*

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        if-no-files-found: error
        # Distributions are already compressed; don't recompress.
        compression-level: 0

  # ── 2. Publish to PyPI via OIDC trusted publisher ───────────────────────────
  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indexed-sh
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: write   # attach distributions to GitHub Release

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Default packages-dir: dist/ — no override needed.

    - name: Attach distributions to GitHub Release
      if: always() && github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
