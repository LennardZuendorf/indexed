name: Release — Build + Publish to PyPI

# Trigger: publish a GitHub Release (UI) with a semver tag (vX.Y.Z or X.Y.Z).
# The tag IS the release version — chosen at release time, not pre-bumped.
#
# Flow:
#   build      — checkout the tag (full history, for hatch-vcs), build wheel +
#                sdist, validate (archive + twine metadata)
#   publish    — OIDC trusted-publish to PyPI, attach dists to the Release
#
# Versioning: pyproject declares `dynamic = ["version"]` and hatch-vcs reads
# the version straight from the git tag at build time. Nothing is pre-bumped,
# nothing is written back — main carries no version string to drift, so there
# is no backmerge job. (The old one pushed to main directly and was rejected
# by the "changes must be made through a pull request" ruleset; the fix is to
# not need the push at all.)
on:
  release:
    types: [published]
  workflow_dispatch:   # build-only smoke test (no tag, no publish)

# Read-only default; the publish job opts into the writes it needs (OIDC token
# + attaching dists to the Release). A job-level block replaces this one wholly.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 1. Build wheel + sdist from the tag and validate ────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout tagged commit
      uses: actions/checkout@v4
      with:
        # hatch-vcs derives the version from `git describe`, so the build needs
        # the tags and enough history to reach them — not a depth-1 checkout.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      run: python -m pip install uv

    - name: Install dependencies
      run: uv sync

    - name: Validate release tag
      # The tag IS the release version — hatch-vcs reads it directly, so
      # nothing is written here. Fail fast on a malformed tag before building.
      # Skipped on workflow_dispatch (no tag).
      if: github.event_name == 'release'
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        ver="${REF_NAME#v}"
        if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::release tag '$REF_NAME' is not a X.Y.Z semver version"
          exit 1
        fi
        echo "releasing $ver"

    - name: Build wheel + sdist
      run: uv build --out-dir dist

    - name: Verify built version matches the release tag
      # Guard rail for the dynamic version: a dirty tree or a checkout that
      # can't reach the tag makes hatch-vcs emit a `X.Y.Z.devN+g<sha>` version
      # instead. PyPI rejects local segments anyway — fail here, where the
      # mismatch is legible, rather than at upload.
      if: github.event_name == 'release'
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        ver="${REF_NAME#v}"
        if [ ! -f "dist/indexed_sh-${ver}-py3-none-any.whl" ] \
           || [ ! -f "dist/indexed_sh-${ver}.tar.gz" ]; then
          echo "::error::built dists do not carry version $ver (tag $REF_NAME)"
          ls -1 dist
          exit 1
        fi
        echo "built dists carry $ver"

    - name: Validate wheel with PyPI's archive validator
      # Same checks PyPI's warehouse runs on upload. Wheel-only: this is a ZIP
      # validator and cannot read the .tar.gz sdist (twine check covers both).
      run: uv run python scripts/validate_wheel.py dist/*.whl

    - name: Check distribution metadata (twine)
      # Archive validator (above) checks the zip bytes; twine check --strict
      # validates that the long_description renders on PyPI (render warnings
      # fail). Full metadata acceptance is enforced by the OIDC publish itself.
      run: uv run --with twine twine check --strict dist/*

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        if-no-files-found: error
        # Distributions are already compressed; don't recompress.
        compression-level: 0

  # ── 2. Publish to PyPI via OIDC trusted publisher ───────────────────────────
  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indexed-sh
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: write   # attach distributions to the Release
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Default packages-dir: dist/ — no override needed.

    - name: Attach distributions to GitHub Release
      if: always()
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
